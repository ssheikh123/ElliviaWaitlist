name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job elevates only what Pages needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # PUBLIC values only: they are embedded in the website.
      # Set them under Settings -> Secrets and variables -> Actions (Variables preferred;
      # repository Secrets with the same names are accepted as a fallback).
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_WAITLIST_FUNCTION_URL: ${{ vars.VITE_WAITLIST_FUNCTION_URL || secrets.VITE_WAITLIST_FUNCTION_URL }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY }}
      VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL || secrets.VITE_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check required configuration
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (Settings -> Secrets and variables -> Actions -> Variables)."
              missing=1
            fi
          done
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*) echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY contains a SECRET key. Use the sb_publishable_ key."; missing=1 ;;
          esac
          exit $missing

      - run: npm ci

      - name: Type-check and test
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npx vite build

      - name: Guard against leaked secrets in the bundle
        run: |
          if grep -rEl 'sb_secret_|service_role|TURNSTILE_SECRET' dist; then
            echo "::error::A secret-looking value was found in the build output. Aborting deploy."
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
